<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><defs><linearGradient id="w" x1="0" x2="1"><stop stop-color="#1fa8ff"/><stop offset="0.6" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs><rect width="1400" height="560" rx="32" fill="#050a12"/><text x="55" y="60" font-family="Segoe UI,Arial" font-size="32" font-weight="800" fill="#f4f8ff">Officer screening workflow</text><text x="55" y="90" font-family="Segoe UI,Arial" font-size="15" fill="#839ab0">Every screening is attached to an authenticated officer and persisted for traceability.</text><g font-family="Segoe UI,Arial"><g transform="translate(55 150)"><circle cx="55" cy="55" r="55" fill="#0d2033" stroke="#38bdf8" stroke-width="3"/><text x="55" y="49" text-anchor="middle" font-size="22" font-weight="800" fill="#f4f8ff">1</text><text x="55" y="79" text-anchor="middle" font-size="13" fill="#69c8ff">LOGIN</text><text x="130" y="44" font-size="19" font-weight="700" fill="#f4f8ff">Officer authentication</text><text x="130" y="70" font-size="14" fill="#8ba4bb">MongoDB credential lookup + PBKDF2 password verification + session</text></g><g transform="translate(55 270)"><circle cx="55" cy="55" r="55" fill="#0d2033" stroke="#22d3ee" stroke-width="3"/><text x="55" y="49" text-anchor="middle" font-size="22" font-weight="800" fill="#f4f8ff">2</text><text x="55" y="79" text-anchor="middle" font-size="13" fill="#61e7f5">CAPTURE</text><text x="130" y="44" font-size="19" font-weight="700" fill="#f4f8ff">Upload document + person photo</text><text x="130" y="70" font-size="14" fill="#8ba4bb">Browser camera or photo upload • blue guide • secure file checks</text></g><g transform="translate(55 390)"><circle cx="55" cy="55" r="55" fill="#0d2033" stroke="#34d399" stroke-width="3"/><text x="55" y="49" text-anchor="middle" font-size="22" font-weight="800" fill="#f4f8ff">3</text><text x="55" y="79" text-anchor="middle" font-size="13" fill="#67e9ad">ANALYZE</text><text x="130" y="44" font-size="19" font-weight="700" fill="#f4f8ff">AI + rules screening</text><text x="130" y="70" font-size="14" fill="#8ba4bb">OCR → validation → integrity → face → risk → case record</text></g><g transform="translate(770 150)"><rect width="575" height="345" rx="22" fill="#0a1623" stroke="#2c526d"/><text x="30" y="42" font-size="15" font-weight="700" fill="#61c4ff">RESULT / AUDIT OUTPUT</text><text x="30" y="82" font-size="22" font-weight="800" fill="#f4f8ff">Officer-facing evidence package</text><text x="30" y="122" font-size="16" fill="#a1b5c8">• extracted identity fields</text><text x="30" y="151" font-size="16" fill="#a1b5c8">• document validity / rule findings</text><text x="30" y="180" font-size="16" fill="#a1b5c8">• tampering indicators + suspicious regions</text><text x="30" y="209" font-size="16" fill="#a1b5c8">• person ↔ document face comparison</text><text x="30" y="238" font-size="16" fill="#a1b5c8">• risk score / level / decision</text><text x="30" y="267" font-size="16" fill="#a1b5c8">• case ID + officer + timestamp</text><rect x="30" y="292" width="250" height="36" rx="18" fill="#0c2530" stroke="#2f806d"/><text x="155" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#66e5b1">TRACEABLE • AUDITABLE</text></g></g><path d="M655 205H735" stroke="url(#w)" stroke-width="6"/><polygon points="735,205 719,196 719,214" fill="#22d3ee"/><path d="M655 325H735" stroke="url(#w)" stroke-width="6"/><polygon points="735,325 719,316 719,334" fill="#22d3ee"/><path d="M655 445H735" stroke="url(#w)" stroke-width="6"/><polygon points="735,445 719,436 719,454" fill="#22d3ee"/></svg>